<!DOCTYPE html>

<html lang="en">

<head>

  <meta charset="UTF-8" />

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Welcome</title>



  <style>

    body {

      margin: 0;

      min-height: 100vh;

      font-family: Arial, sans-serif;

      background: linear-gradient(135deg, #111827, #1f2937);

      color: white;

      display: flex;

      justify-content: center;

      align-items: center;

      padding: 24px;

      text-align: center;

    }



    .card {

      max-width: 430px;

      width: 100%;

      background: rgba(255, 255, 255, 0.09);

      border-radius: 28px;

      padding: 26px;

      box-shadow: 0 12px 35px rgba(0,0,0,0.35);

    }



    iframe {

      width: 100%;

      max-width: 360px;

      height: 260px;

      border: none;

      border-radius: 20px;

      margin-bottom: 18px;

    }



    h1 {

      font-size: 40px;

      margin: 8px 0 10px;

    }



    p {

      font-size: 19px;

      color: #d1d5db;

      line-height: 1.5;

    }

    .family-photo {
    width: 100%;
    max-width: 100%;
    height: auto;
    display: block;
    margin: 24px auto;
    border-radius: 20px;
    border: 1px solid rgba(255,255,255,0.15);
    box-shadow: 0 10px 25px rgba(0,0,0,.35);
    }

    .photo-box {
    margin-top: 24px;
    padding: 20px;
    border-radius: 20px;
    background: rgba(255,255,255,0.12);
    border: 1px solid rgba(255,255,255,0.18);
    }


    }

    .qr-box {

      margin-top: 24px;

      padding: 20px;

      border-radius: 20px;

      background: rgba(255,255,255,0.12);

      border: 1px solid rgba(255,255,255,0.18);

    }



    .qr-icon {

      font-size: 52px;

      margin-bottom: 8px;

      animation: pulse 1.8s infinite;

    }



    .footer {

      margin-top: 22px;

      font-size: 14px;

      color: #9ca3af;

    }



    @keyframes pulse {

      0% { transform: scale(1); opacity: 1; }

      50% { transform: scale(1.08); opacity: 0.85; }

      100% { transform: scale(1); opacity: 1; }

    }

  </style>

</head>



<body>

  <div class="card">

    <iframe

      src="https://giphy.com/embed/l0MYC0LajbaPoEADu"

      allowfullscreen>

    </iframe>



    <h1>Welcome!</h1>

   <div class="photo-box">
    <img src="family.jpg" class="family-photo" alt="Our Family">
   </div>

    <p>Glad you’re here.</p>



    <div class="qr-box">

      <div class="qr-icon">📷</div>

      <h2>Scan the QR Code</h2>

      <p>Use your phone camera to scan the QR code next to this tag and connect to Wi-Fi.</p>

    </div>



    <div class="footer">

      Have a great visit!

    </div>

  </div>

</body>

</html>
